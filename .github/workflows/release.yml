name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Tag to build, or blank to build the current branch
        required: false
        default: ""

permissions:
  contents: read

jobs:
  exe:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pyinstaller --clean --noconfirm scanverdict.spec

      - run: choco install ffmpeg -y --no-progress

      # The exe has to work on a machine with no Python and no source tree, so
      # run it from a directory that has neither.
      - name: Run the built exe
        shell: bash
        run: |
          python tests/make_fixtures.py "$RUNNER_TEMP/fixtures"
          mkdir -p "$RUNNER_TEMP/smoke"
          cp dist/scanverdict.exe "$RUNNER_TEMP/fixtures/telecine.mkv" "$RUNNER_TEMP/smoke/"
          cd "$RUNNER_TEMP/smoke"
          ./scanverdict.exe --version
          ./scanverdict.exe telecine.mkv | tee out.txt
          grep -q "verdict: telecine_3_2" out.txt
          grep -q "verified:" out.txt
          ./scanverdict.exe missing.mkv && exit 1 || test $? -eq 1

      - name: Checksum
        shell: bash
        run: sha256sum dist/scanverdict.exe | tee dist/scanverdict.exe.sha256

      # Ties this exact binary to this workflow run and this commit. `gh
      # attestation verify` checks it without anyone trusting the build machine.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/scanverdict.exe

      - uses: actions/upload-artifact@v4
        with:
          name: scanverdict-exe
          path: |
            dist/scanverdict.exe
            dist/scanverdict.exe.sha256

      - name: Attach to the release
        if: startsWith(inputs.ref || github.ref_name, 'v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.ref || github.ref_name }}"
          gh release upload "$tag" dist/scanverdict.exe dist/scanverdict.exe.sha256 \
            --clobber --repo "$GITHUB_REPOSITORY"
